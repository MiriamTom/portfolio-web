    /* PHOTO-SPECIFIC: Film grain noise overlay */
    body::after { content:'';position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:0.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:150px; }
    .photo-header { padding:3rem 1.5rem 1rem;text-align:center; }
    .chaos-gallery { display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));grid-auto-rows:280px;gap:6px;padding:1rem; }
    .gallery-item { width:100%;height:100%;object-fit:cover;transition:transform .4s ease,filter .4s ease;border-radius:3px;filter:grayscale(20%);position:relative;z-index:1; }
    .gallery-item:hover { transform:scale(1.04);z-index:2;filter:grayscale(0%); }
    .item-tall { grid-row:span 2; }
    .item-wide { grid-column:span 2; }
    .item-large { grid-column:span 2;grid-row:span 2; }
    /* Preloader for photo page */
    #preloader { background:#000; }
    .loader-logo { width:80px;height:80px; }
    @media(max-width:640px) {
        .chaos-gallery { grid-template-columns:1fr 1fr;grid-auto-rows:180px; }
        .item-large,.item-wide { grid-column:span 1; }
    }
