    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .glitch-title::before { background:linear-gradient(135deg,#c0392b,#d4a853);-webkit-background-clip:text;-webkit-text-fill-color:transparent;clip-path:polygon(0 30%,100% 30%,100% 50%,0 50%);animation:glitchA 5s infinite; }
        .glitch-title::after { background:linear-gradient(135deg,#d4a853,#f5efe6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;clip-path:polygon(0 60%,100% 60%,100% 80%,0 80%);animation:glitchB 5s infinite; }

        .project-card {
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
        }
        .project-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 35px -10px rgba(192,57,43,0.3);
            border-color: var(--mt-red, #c0392b) !important;
        }
        /* floating emoji container */
        .floating-emoji {
            position: fixed;
            pointer-events: none;
            z-index: 1050;
            font-size: 2rem;
            animation: floatEmoji 1.2s ease-out forwards;
            filter: drop-shadow(0 0 6px rgba(192,57,43,0.5));
        }
        @keyframes floatEmoji {
            0% {
                opacity: 1;
                transform: scale(0.8) translateY(0) rotate(0deg);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.2) translateY(-25px) rotate(12deg);
            }
            100% {
                opacity: 0;
                transform: scale(1.5) translateY(-70px) rotate(20deg);
            }
        }

        /* modal customization -> use dark theme from styles.css */
        .modal-content {
            background: var(--mt-card, #161616);
            border: 1px solid var(--mt-red, #c0392b);
            border-radius: 28px;
            color: var(--mt-text, #e8e0d5);
            box-shadow: 0 25px 45px rgba(0,0,0,0.6);
        }
        .modal-header {
            border-bottom-color: var(--mt-border, #2a2a2a);
            background: rgba(0,0,0,0.3);
            border-radius: 28px 28px 0 0;
        }
        .modal-header .btn-close {
            filter: invert(1) grayscale(1) brightness(2);

        }
        .modal-body {
            padding: 1.8rem;
        }
        .modal-footer {
            border-top-color: var(--mt-border, #2a2a2a);
            background: rgba(0,0,0,0.2);
        }
        .detail-modal-icon {
            font-size: 2rem;
            margin-right: 12px;

        }

            background: var(--mt-red-dim, rgba(192,57,43,0.2));
            border: 1px solid var(--mt-red, #c0392b);
            border-radius: 40px;
            padding: 0.2rem 1rem;
            font-size: 0.8rem;
            display: inline-block;
            margin: 0.2rem;
            color: var(--mt-gold, #d4a853);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0a0c12;
            color: #eef2ff;
            overflow-x: hidden;
        }

        /* animated grid background */
        #proj-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.2;
        }

        .proj-wrapper {
            position: relative;
            z-index: 2;
        }

        main {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        h1.proj-title {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: clamp(2.5rem, 7vw, 4rem);
            text-align: center;
            margin-bottom: 0.5rem;
            background:linear-gradient(135deg,#FFFFFF 0%,#c0392b,#d4a853);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .proj-subtitle {
            text-align: center;
            color: #9ca3af;
            font-style: italic;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .tagline {
            text-align: center;
            color: #6c86a3;
            font-size: 0.9rem;
            margin-bottom: 3rem;
            border-bottom: 1px dashed rgb(200 112 100 );
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
            padding-bottom: 0.5rem;
        }

        /* language filter tabs */
        .filter-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
            margin-bottom: 3rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 1rem;
        }

        .filter-btn {
            background: rgba(20, 25, 40, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #ccd6f0;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Syne', monospace;
            letter-spacing: 0.5px;
        }

        .filter-btn:hover {
            background: #2d3e6e;
            color: white;
            border-color: #6c8eff;
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: #3b5b9b;
            color: white;
            border-color: #a0c0ff;
            box-shadow: 0 0 12px rgba(100, 150, 255, 0.4);
        }

        /* project grid — 2 columns on desktop, 1 on mobile */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-top: 1rem;
        }

        /* project card */
        .project-card {
            background: rgba(18, 22, 35, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            border: 1px solid rgba(90, 120, 180, 0.25);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
        }

        .project-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 24px 40px rgba(0, 0, 0, 0.5);
            border-color: rgba(130, 170, 250, 0.6);
        }

        /* card header with icon + language badge */
        .card-header {
            padding: 1.2rem 1.5rem 0.5rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .card-header h3 {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            margin: 0;
            letter-spacing: -0.3px;
        }

        .lang-badge {
            background: #1e2a3e;
            padding: 0.25rem 0.8rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #b9d0ff;
            border: 1px solid #3f5a82;
        }

        .card-preview {
            padding: 1.2rem 1.5rem;
            font-size: 0.95rem;
            color: #cbd5e6;
            line-height: 1.4;
            min-height: 85px;
        }

        .card-preview i {
            font-size: 0.8rem;
            color: #7e9cd9;
        }

        /* expanded details (hidden by default) */
        .project-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            background: rgba(8, 12, 22, 0.7);
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 0.2rem;
        }

        .project-card.active .project-details {
            max-height: 380px;   /* enough for content */
        }

        .details-inner {
            padding: 1.2rem 1.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .detail-section {
            border-left: 3px solid #5f7fbf;
            padding-left: 0.8rem;
        }

        .detail-section strong {
            font-weight: 700;
            color: #e0eaff;
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
        }

        .detail-section p, .detail-section span {
            font-size: 0.85rem;
            color: #b4c2df;
            margin: 0;
        }

        .project-links {
            display: flex;
            gap: 1.2rem;
            margin-top: 0.6rem;
        }

        .project-link {
            color: #9cb2ff;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .project-link:hover {
            color: white;
            text-decoration: underline;
        }

        /* empty state */
        .no-projects {
            text-align: center;
            padding: 4rem;
            color: #8f9bb3;
            font-style: italic;
        }


        @media (max-width: 700px) {
            .projects-grid {
                grid-template-columns: 1fr;
            }
            .card-header h3 {
                font-size: 1.3rem;
            }
        }

    </style>
</head>

    // helper: get primary language label
    function getLangLabel(langs) {
        let primary = langs[0];
        if(primary === "JavaScript" || primary === "Firebase") return "WEB/JS";
        if(primary === "Java" || primary === "Android") return "JAVA";
        if(primary === "Python") return "PYTHON";
        if(primary === "C") return "C";
        return langs[0];
    }

    // function to spawn floating emojis around clicked element
    function spawnFloatingEmojis(x, y, emojiSet = ['✨', '🔥', '💻', '🎯', '🚀', '⭐', '🌀', '🎨', '📱', '🧠']) {
        const count = 12 + Math.floor(Math.random() * 8);
        for (let i = 0; i < count; i++) {
            const emoji = emojiSet[Math.floor(Math.random() * emojiSet.length)];
            const div = document.createElement('div');
            div.className = 'floating-emoji';
            div.textContent = emoji;
            const offsetX = (Math.random() - 0.5) * 100;
            const offsetY = (Math.random() - 0.5) * 70 - 20;
            div.style.left = (x + offsetX) + 'px';
            div.style.top = (y + offsetY) + 'px';
            div.style.fontSize = (1.2 + Math.random() * 1.5) + 'rem';
            div.style.animationDuration = (0.8 + Math.random() * 0.7) + 's';
            document.body.appendChild(div);
            setTimeout(() => { if(div && div.remove) div.remove(); }, 1300);
        }
    }

    // show modal with full project details (modal instead of expand inside card)
    function showModalForProject(project) {
        const modalBody = document.getElementById('modalBodyContent');
        const modalTitle = document.getElementById('projectModalLabel');
        modalTitle.innerHTML = `${project.icon || '📌'} ${project.name}`;

        // build rich modal content
        const techStackHtml = project.languages.map(lang => `<span class="tech-badge-modal">${lang}</span>`).join('');
        const demoLink = project.demo ? `<a class="project-link me-3" href="${project.demo}" target="_blank"><i class="bi bi-globe"></i> Live Demo →</a>` : '';
        const githubLink = project.github ? `<a class="project-link" href="${project.github}" target="_blank"><i class="bi bi-github"></i> Source Code →</a>` : '<span class="text-muted"><i class="bi bi-lock"></i> Private repo</span>';

        modalBody.innerHTML = `
            <div class="d-flex align-items-center mb-3">
                <span class="detail-modal-icon">${project.icon || '🚀'}</span>
                <h3 class="mb-0" style="font-family:'Syne',sans-serif; color: var(--mt-gold);">${project.name}</h3>
            </div>
            <div class="detail-section mb-3">
                <strong>📖 Full Story</strong>
                <p class="mt-1">${project.fullDesc}</p>
            </div>
            <div class="detail-section mb-3">
                <strong>📍 Location / Context</strong>
                <p>${project.location}</p>
            </div>
            <div class="detail-section mb-3">
                <strong>🏆 Outcome & Impact</strong>
                <p>${project.outcome}</p>
            </div>
            <div class="detail-section mb-3">
                <strong>🧰 Tech Stack</strong>
                <div class="mt-2">${techStackHtml}</div>
            </div>
            <div class="detail-section mb-2">
                <strong>🔗 Resources</strong>
                <div class="mt-2">${demoLink} ${githubLink}</div>
            </div>
        `;

        const modal = new bootstrap.Modal(document.getElementById('projectModal'));
        modal.show();
    }

    // render cards: replace inline expand with modal trigger
    function renderProjects(filterCategory) {
        const container = document.getElementById('projects-container');
        if(!container) return;
        let filtered = projectsData;
        if(filterCategory !== 'all') {
            filtered = projectsData.filter(proj => proj.category === filterCategory);
        }
        if(filtered.length === 0) {
            container.innerHTML = `<div class="no-projects">✨ No projects in this category? Time to build one ✨</div>`;
            return;
        }
        container.innerHTML = '';
        filtered.forEach(proj => {
            const card = document.createElement('div');
            card.className = 'project-card';
            const primaryLang = getLangLabel(proj.languages);
            let langBadgeColor = '#c77dff';
            if(proj.category === 'java') langBadgeColor = '#c77dff';
            else if(proj.category === 'python') langBadgeColor = '#4c9aff';
            else if(proj.category === 'web') langBadgeColor = '#5fbc7a';
            else langBadgeColor = '#f39c12';

            let previewText = proj.shortDesc.length > 100 ? proj.shortDesc.slice(0,100)+'…' : proj.shortDesc;

            card.innerHTML = `
                <div class="card-header">
                    <h3>${proj.icon || '📌'} ${proj.name}</h3>
                    <span class="lang-badge" style="background:${langBadgeColor}20; border-color:${langBadgeColor}80; color:${langBadgeColor};">${primaryLang}</span>
                </div>
                <div class="card-preview">
                    <i class="bi bi-caret-right-fill" style="font-size:0.7rem; margin-right:6px;"></i> ${previewText}
                </div>
                <div class="p-3 pt-0 text-end">
                    <span class="badge bg-dark text-light" style="background:var(--mt-red-dim) !important; border:1px solid var(--mt-red);">click for details →</span>
                </div>
            `;

            // on click -> open modal + floating emojis
            card.addEventListener('click', (e) => {
                if(e.target.closest('.project-link')) return;
                // get click coordinates for emoji burst
                let clientX, clientY;
                if(e.clientX && e.clientY) {
                    clientX = e.clientX;
                    clientY = e.clientY;
                } else {
                    const rect = card.getBoundingClientRect();
                    clientX = rect.left + rect.width/2;
                    clientY = rect.top + rect.height/2;
                }
                spawnFloatingEmojis(clientX, clientY, ['✨', '💡', '🔥', '⭐', '🚀', '🎯', '💻', '📱', '🧠', '🎨', '⚡']);
                showModalForProject(proj);
            });
            container.appendChild(card);
        });
    }

    // --- FILTER LOGIC + initial render
    const filterBtns = document.querySelectorAll('.filter-btn');
    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filterValue = btn.getAttribute('data-filter');
            renderProjects(filterValue);
        });
    });

    // background canvas (scanline grid)
    const cvs = document.getElementById('proj-canvas');
    const ctx = cvs.getContext('2d');
    function resizeCanvas() {
        cvs.width = window.innerWidth;
        cvs.height = window.innerHeight;
        drawGrid();
    }
    function drawGrid() {
        if(!ctx) return;
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        const step = 42;
        ctx.strokeStyle = '#c0392b';
        ctx.lineWidth = 0.5;
        for(let x = 0; x < cvs.width; x += step) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, cvs.height);
            ctx.stroke();
        }
        for(let y = 0; y < cvs.height; y += step) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(cvs.width, y);
            ctx.stroke();
        }
        ctx.fillStyle = 'rgba(10,12,20,0.2)';
        ctx.fillRect(0,0,cvs.width,cvs.height);
    }
    window.addEventListener('resize', () => { resizeCanvas(); drawGrid(); });
    resizeCanvas();

    // initial load all projects
    renderProjects('all');
</script>
</body>
</html>
